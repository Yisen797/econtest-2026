; ESP32-S3 ↔ MSPM0G3507 UART1 通信测试
; S3 GPIO16(RX)→PA8, GPIO17(TX)→PA9, 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_port = COM14
upload_port = COM14
board_build.flash_mode = qio
board_build.f_flash = 80000000L
